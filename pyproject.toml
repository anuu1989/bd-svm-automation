[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-svm-automation"
version = "0.2.0"
description = "End-to-end Black Duck to SVM synchronization test automation"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
ui = ["selenium>=4.15"]
dev = ["ruff>=0.5"]

[project.scripts]
bd-svm = "bd_svm.cli:main"

[tool.setuptools]
packages = ["bd_svm"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E731", "B008"]

[tool.ruff.lint.per-file-ignores]
"bd_svm/config.py" = ["E501"]
