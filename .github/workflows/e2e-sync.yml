# Black Duck -> SVM end-to-end sync test.
#
# The flow has two 8h waits, so it is NOT one long job. A scheduled run calls
# `make tick-idle` every 30 minutes:
#   - nothing active  -> starts a cycle (add component, verify in Black Duck)
#   - a wait elapsed  -> triggers the pipeline, runs SVM API/UI checks, advances
# State (data/state.db) is carried between runs with the Actions cache.
#
# Setup: Settings > Secrets and variables > Actions
#   Secrets:   BLACKDUCK_URL BLACKDUCK_API_TOKEN SVM_URL SVM_API_TOKEN
#              GITLAB_TRIGGER_TOKEN GITLAB_ACCESS_TOKEN SVM_UI_USER SVM_UI_PASSWORD
#   Variables: BLACKDUCK_PROJECT BLACKDUCK_PROJECT_VERSION GITLAB_URL GITLAB_PROJECT_ID
#              SVM_UI_URL  SVM_UI_ENABLED ("true" to install Selenium)
#              BD_SVM_CONFIG_YAML (optional: full config.yaml; default is config.example.yaml)
name: E2E Black Duck-SVM sync

on:
  schedule:
    - cron: "*/30 * * * *"      # GitHub schedules are best-effort, may be delayed
  workflow_dispatch:
    inputs:
      action:
        description: Make target to run
        type: choice
        default: tick-idle
        options: [tick-idle, doctor, start, tick, status, status-json, report, cleanup]
      run_id:
        description: Run id (only for cleanup)
        type: string
        required: false

# Only one tick at a time: the state DB is single-writer.
concurrency:
  group: bd-svm-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLACKDUCK_URL: ${{ secrets.BLACKDUCK_URL }}
      BLACKDUCK_API_TOKEN: ${{ secrets.BLACKDUCK_API_TOKEN }}
      BLACKDUCK_PROJECT: ${{ vars.BLACKDUCK_PROJECT }}
      BLACKDUCK_PROJECT_VERSION: ${{ vars.BLACKDUCK_PROJECT_VERSION }}
      SVM_URL: ${{ secrets.SVM_URL }}
      SVM_API_TOKEN: ${{ secrets.SVM_API_TOKEN }}
      SVM_UI_URL: ${{ vars.SVM_UI_URL }}
      SVM_UI_USER: ${{ secrets.SVM_UI_USER }}
      SVM_UI_PASSWORD: ${{ secrets.SVM_UI_PASSWORD }}
      GITLAB_URL: ${{ vars.GITLAB_URL }}
      GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
      GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      BD_SVM_CONFIG_YAML: ${{ vars.BD_SVM_CONFIG_YAML }}
      ACTION: ${{ inputs.action || 'tick-idle' }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore state DB
        uses: actions/cache/restore@v4
        with:
          path: data
          key: bd-svm-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bd-svm-state-

      - name: Write config
        run: |
          mkdir -p config
          if [ -n "$BD_SVM_CONFIG_YAML" ]; then
            printf '%s\n' "$BD_SVM_CONFIG_YAML" > config/config.yaml
          else
            cp config/config.example.yaml config/config.yaml
          fi

      - name: Install
        run: |
          if [ "${{ vars.SVM_UI_ENABLED }}" = "true" ]; then make install-ui; else make install; fi

      - name: Run make target
        run: |
          case "$ACTION" in
            tick-idle|doctor|start|tick|status|status-json|report) make "$ACTION" ;;
            cleanup) make cleanup RUN_ID="$RUN_ID" ;;
            *) echo "unknown action: $ACTION"; exit 2 ;;
          esac

      - name: Always write status and report
        if: always()
        run: |
          mkdir -p reports
          make status || true
          make report || true

      - name: Save state DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: bd-svm-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd-svm-report
          path: reports/report.md
          if-no-files-found: ignore
