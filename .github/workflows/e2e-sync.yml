# Black Duck -> SVM end-to-end sync test.
#
# The flow has long waits, so it is NOT one long job. A scheduled run calls
# `make tick-idle` every 30 minutes:
#   - capacity available -> starts a cycle (adds a batch, verifies in Black Duck)
#   - a check is due     -> triggers the pipeline (coalesced), polls SVM, advances
# State (data/state.db) is persisted between runs on the `bd-svm-state` branch
# (scripts/state.sh). Use a PRIVATE repo, or set STATE_BACKEND=s3.
#
# Setup: Settings > Secrets and variables > Actions
#   Secrets:   BLACKDUCK_URL BLACKDUCK_API_TOKEN SVM_URL SVM_API_TOKEN
#              GITLAB_TRIGGER_TOKEN GITLAB_ACCESS_TOKEN SVM_UI_USER SVM_UI_PASSWORD
#              NOTIFY_WEBHOOK_URL
#   Variables: BLACKDUCK_PROJECT BLACKDUCK_PROJECT_VERSION GITLAB_URL GITLAB_PROJECT_ID
#              SVM_UI_URL  SVM_UI_ENABLED ("true" to install Selenium)
#              STATE_BACKEND (git-branch | s3 | none; default git-branch)
#              BD_SVM_CONFIG_YAML (optional: full config.yaml; default is config.example.yaml)
name: E2E Black Duck-SVM sync

on:
  schedule:
    - cron: "*/30 * * * *"      # GitHub schedules are best-effort, may be delayed
  workflow_dispatch:
    inputs:
      action:
        description: Make target to run
        type: choice
        default: tick-idle
        options: [tick-idle, doctor, start, tick, drain, status, status-json, report, sweep, sweep-apply, cleanup, notify-test]
      run_id:
        description: Run id (only for cleanup)
        type: string
        required: false

# Only one tick at a time: the state DB is single-writer.
concurrency:
  group: bd-svm-e2e
  cancel-in-progress: false

permissions:
  contents: write               # push the bd-svm-state branch

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLACKDUCK_URL: ${{ secrets.BLACKDUCK_URL }}
      BLACKDUCK_API_TOKEN: ${{ secrets.BLACKDUCK_API_TOKEN }}
      BLACKDUCK_PROJECT: ${{ vars.BLACKDUCK_PROJECT }}
      BLACKDUCK_PROJECT_VERSION: ${{ vars.BLACKDUCK_PROJECT_VERSION }}
      SVM_URL: ${{ secrets.SVM_URL }}
      SVM_API_TOKEN: ${{ secrets.SVM_API_TOKEN }}
      SVM_UI_URL: ${{ vars.SVM_UI_URL }}
      SVM_UI_USER: ${{ secrets.SVM_UI_USER }}
      SVM_UI_PASSWORD: ${{ secrets.SVM_UI_PASSWORD }}
      GITLAB_URL: ${{ vars.GITLAB_URL }}
      GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
      GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      BD_SVM_CONFIG_YAML: ${{ vars.BD_SVM_CONFIG_YAML }}
      STATE_BACKEND: ${{ vars.STATE_BACKEND || 'git-branch' }}
      ACTION: ${{ inputs.action || 'tick-idle' }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore state
        run: make state-pull

      - name: Write config
        run: |
          mkdir -p config
          if [ -n "$BD_SVM_CONFIG_YAML" ]; then
            printf '%s\n' "$BD_SVM_CONFIG_YAML" > config/config.yaml
          else
            cp config/config.example.yaml config/config.yaml
          fi

      - name: Install
        run: |
          if [ "${{ vars.SVM_UI_ENABLED }}" = "true" ]; then make install-ui; else make install; fi

      - name: Run make target
        run: |
          case "$ACTION" in
            tick-idle|doctor|start|tick|drain|status|status-json|report|sweep|notify-test) make "$ACTION" ;;
            sweep-apply) make sweep-apply YES=1 ;;
            cleanup) make cleanup RUN_ID="$RUN_ID" ;;
            *) echo "unknown action: $ACTION"; exit 2 ;;
          esac

      - name: Reports
        if: always()
        run: |
          make status || true
          make report report-junit report-json || true

      - name: Save state
        if: always()
        run: make state-push

      - name: Publish test summary
        if: always()
        run: |
          [ -f reports/report.md ] && cat reports/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd-svm-reports
          path: |
            reports/
            data/evidence/
          if-no-files-found: ignore
