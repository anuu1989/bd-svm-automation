# Config for `make demo` / `make mock-server`: talks to bd_svm/mock_server.py.
# Exercises every scenario in one batch with short waits.
blackduck:
  base_url: http://127.0.0.1:8099
  api_token: mock-token
  project_name: svm-e2e-test
  project_version: main
  candidates:
    - { name: log4j-core, version: "2.14.1" }
    - { name: jackson-databind, version: "2.9.8", scenario: remediation, status: IGNORED }
    - { name: commons-text, version: "1.9", scenario: upgrade, upgrade_to: "1.10.0" }
    - { name: left-pad, version: "1.3.0", scenario: negative }

svm:
  require: all
  api:
    enabled: true
    base_url: http://127.0.0.1:8099
    path: /svm/api/vulnerabilities
    params: { component: "{component_name}" }
    list_key: data.items
    fields: { severity: severity, remediation_status: status }

pipeline:
  type: webhook
  webhook: { url: "http://127.0.0.1:8099/pipeline/trigger", method: POST }

test:
  mode: poll
  wait_hours: 0.02              # 72 s deadline
  first_check_seconds: 1
  check_interval_seconds: 2
  poll_seconds: 2
  batch_size: 4
  max_attempts: 3
  retry_seconds: 2
  assessment_timeout_seconds: 5
  state_db: data/mock-state.db

evidence:
  dir: data/mock-evidence
